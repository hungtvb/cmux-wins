[package]
name = "cmux-wins"
version = "0.1.0"
description = "A Windows 11 terminal workspace for AI coding agents"
authors = ["Hung"]
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "cmux_wins_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portable-pty = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
url = "2"
