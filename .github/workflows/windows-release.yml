name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $branches = git branch -r --contains $env:GITHUB_SHA
          if ($branches -notmatch "origin/main") {
            throw "Release tag must point to a commit contained in origin/main. Found: $branches"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Validate release versions
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoMetadata = cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json
          $cargoVersion = $cargoMetadata.packages[0].version
          $versions = @($packageVersion, $tauriVersion, $cargoVersion) | Select-Object -Unique

          if ($versions.Count -ne 1) {
            throw "Version mismatch. package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }

          $isTag = $env:GITHUB_REF -like "refs/tags/v*"
          if ($isTag) {
            $tag = $env:GITHUB_REF_NAME
            $tagVersion = $tag -replace '^v', ''
            if ($tagVersion -ne $packageVersion) {
              throw "Tag/config version mismatch. tag=$tagVersion package=$packageVersion"
            }
            $publish = "true"
          } else {
            $tag = "dry-run-v$packageVersion"
            $publish = "false"
          }

          "version=$packageVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Run Windows ConPTY tests
        timeout-minutes: 12
        run: cargo test --manifest-path src-tauri/Cargo.toml --test conpty_smoke -- --nocapture --test-threads=1

      - name: Build MSI and NSIS installers
        run: npm run tauri build

      - name: Build automation CLIs
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin tonymux-cli --bin cmux-cli

      - name: Package portable Windows build
        id: portable
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\package-windows-portable.ps1 `
            -DesktopExecutable .\src-tauri\target\release\tonymux.exe `
            -PrimaryCli .\src-tauri\target\release\tonymux-cli.exe `
            -CompatibilityCli .\src-tauri\target\release\cmux-cli.exe `
            -OutputDirectory .\portable-output `
            -Version "${{ steps.version.outputs.version }}" `
            -Commit $env:GITHUB_SHA

      - name: Prepare versioned release assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null

          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $msi -or -not $nsis) {
            throw "Expected both MSI and NSIS installers"
          }

          Copy-Item $msi.FullName "release-assets/tonymux-$version-x64.msi"
          Copy-Item $nsis.FullName "release-assets/tonymux-$version-x64-setup.exe"
          Copy-Item "${{ steps.portable.outputs.portable_zip }}" `
            "release-assets/tonymux-$version-windows-portable-x64.zip"

          [ordered]@{
            product = "TonyMux"
            version = $version
            tag = "${{ steps.version.outputs.tag }}"
            commit = $env:GITHUB_SHA
            architecture = "x64"
            runner = $env:RUNNER_IMAGE
            publish = "${{ steps.version.outputs.publish }}" -eq "true"
            signed = $env:CODE_SIGNING_CERT_BASE64 -ne "" -and $null -ne $env:CODE_SIGNING_CERT_BASE64
            createdAtUtc = [DateTime]::UtcNow.ToString("o")
          } | ConvertTo-Json | Set-Content release-assets/build-metadata.json
        env:
          CODE_SIGNING_CERT_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}

      - name: Sign release assets with Authenticode
        if: env.CODE_SIGNING_CERT_BASE64 != ''
        env:
          CODE_SIGNING_CERT_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
          CODE_SIGNING_CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkRoot = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdkRoot) { throw "Windows SDK not found" }
          $signtool = Join-Path $sdkRoot.FullName "x64\signtool.exe"
          if (-not (Test-Path $signtool)) { throw "signtool.exe not found under $($sdkRoot.FullName)" }

          $pfxPath = Join-Path $env:RUNNER_TEMP "tonymux-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGNING_CERT_BASE64))
          $password = ConvertTo-SecureString $env:CODE_SIGNING_CERT_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          $cert = Get-PfxCertificate -FilePath $pfxPath

          Get-ChildItem release-assets -File |
            Where-Object { $_.Extension -in ".exe", ".msi" } |
            ForEach-Object {
              Write-Output "Signing $($_.Name)"
              & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /sha1 $cert.Thumbprint $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.Name)" }
            }
          Remove-Item $pfxPath -Force

      - name: Verify signatures and write checksums, SBOM and release notes
        env:
          CODE_SIGNING_CERT_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $signingConfigured = $env:CODE_SIGNING_CERT_BASE64 -ne "" -and $null -ne $env:CODE_SIGNING_CERT_BASE64

          $signable = Get-ChildItem release-assets -File | Where-Object { $_.Extension -in ".exe", ".msi" }
          if ($signingConfigured) {
            foreach ($asset in $signable) {
              $signature = Get-AuthenticodeSignature $asset.FullName
              if ($signature.Status -ne "Valid") {
                throw "Authenticode verification failed for $($asset.Name): $($signature.Status) $($signature.StatusMessage)"
              }
              Write-Output "Verified $($asset.Name): $($signature.SignerCertificate.Subject)"
            }
            $signingNote = "- All installers are Authenticode-signed; SmartScreen reputation builds over time as users run the signed build."
          } else {
            $signingNote = "- Installers are not Authenticode-signed yet and may trigger Windows SmartScreen. Configure CODE_SIGNING_CERT_BASE64 + CODE_SIGNING_CERT_PASSWORD secrets to enable signing (see docs/RELEASING.md)."
          }

          Get-ChildItem release-assets -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content release-assets/SHA256SUMS.txt

          # SBOM: resolved Rust dependency graph from cargo metadata, plus
          # declared frontend dependencies (no lockfile is committed).
          $metadata = cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 | ConvertFrom-Json
          $components = @($metadata.packages | ForEach-Object {
            [ordered]@{
              type = "library"
              name = $_.name
              version = $_.version
              purl = "pkg:cargo/$($_.name.Replace('-','_'))@$($_.version)"
            }
          })
          $packageJson = Get-Content package.json -Raw | ConvertFrom-Json
          $frontendComponents = @($packageJson.dependencies.PSObject.Properties | ForEach-Object {
            [ordered]@{
              type = "library"
              name = $_.Name
              version = "$($_.Value) (declared range; no lockfile committed)"
              purl = "pkg:npm/$($_.Name)"
            }
          })
          $sbom = [ordered]@{
            bomFormat = "CycloneDX"
            specVersion = "1.5"
            version = 1
            metadata = [ordered]@{
              component = [ordered]@{ type = "application"; name = "TonyMux"; version = $version }
              timestamp = [DateTime]::UtcNow.ToString("o")
            }
            components = @($components + $frontendComponents)
          }
          $sbom | ConvertTo-Json -Depth 6 | Set-Content release-assets/tonymux-$version-sbom.json

          $releaseNotes = @'
          # TonyMux v__VERSION__

          Automated Windows build produced from commit `__COMMIT__`.

          ## Assets
          - x64 portable ZIP (extract and run `TonyMux.exe`)
          - x64 MSI installer
          - x64 NSIS setup executable
          - SHA-256 checksum manifest
          - CycloneDX SBOM
          - Build metadata

          __SIGNING_NOTE__
          - Interactive Windows 11 QA evidence is tracked in issue #2.
          - The legacy `cmux-cli.exe`, named pipe and local automation config path remain available for compatibility during the TonyMux rename.

          ## Verify a downloaded asset

          ```powershell
          Get-FileHash .\tonymux-__VERSION__-windows-portable-x64.zip -Algorithm SHA256
          Get-FileHash .\tonymux-__VERSION__-x64-setup.exe -Algorithm SHA256
          ```

          Compare the result with `SHA256SUMS.txt` before extraction or installation.
          '@
          $renderedNotes = $releaseNotes.Replace("__VERSION__", $version).Replace("__COMMIT__", $env:GITHUB_SHA).Replace("__SIGNING_NOTE__", $signingNote)
          $renderedNotes | Set-Content release-notes.md

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tonymux-${{ steps.version.outputs.version }}-x64-${{ steps.version.outputs.publish == 'true' && 'release' || 'dry-run' }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $title = "TonyMux $tag"
          $assets = Get-ChildItem release-assets -File | ForEach-Object { $_.FullName }
          $isPrerelease = $tag -match '-(alpha|beta|rc)(\.|$)'

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $arguments = @(
              "release", "create", $tag,
              "--title", $title,
              "--notes-file", "release-notes.md"
            )
            if ($isPrerelease) {
              $arguments += "--prerelease"
            }
            $arguments += $assets
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
