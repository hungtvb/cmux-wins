name: ChatGPT UI Evidence

on:
  pull_request:
    branches:
      - feat/editable-shortcuts

permissions:
  contents: read

jobs:
  build-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Record build identity
        shell: bash
        run: |
          printf '%s\n' "${{ github.event.pull_request.base.sha }}" > dist/BUILD_SHA.txt
          git status --short > dist/GIT_STATUS.txt

      - name: Upload UI dist
        uses: actions/upload-artifact@v4
        with:
          name: tonymux-ui-evidence-dist
          path: dist
          retention-days: 1
          if-no-files-found: error
