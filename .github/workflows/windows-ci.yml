name: Windows CI

on:
  push:
    branches: [main, feat/windows-mvp]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Type-check and build frontend
        run: npm run build

      - name: Check Rust backend
        id: cargo-check
        continue-on-error: true
        shell: pwsh
        run: |
          cmd /c "cargo check --manifest-path src-tauri/Cargo.toml > cargo-check.log 2>&1"
          $exitCode = $LASTEXITCODE
          Get-Content cargo-check.log
          exit $exitCode

      - name: Upload Rust check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-log
          path: cargo-check.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when Rust check failed
        if: steps.cargo-check.outcome == 'failure'
        shell: pwsh
        run: exit 1
