name: Windows CI

on:
  push:
    branches: [main, "feat/**", "chore/**"]
  pull_request:

jobs:
  windows-cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with Windows target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM resource compiler
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm
          llvm_rc="$(find /usr/lib/llvm-* -type f -name llvm-rc 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$llvm_rc" ]]; then
            echo "llvm-rc was not found after installing LLVM" >&2
            exit 1
          fi
          sudo ln -sf "$llvm_rc" /usr/local/bin/llvm-rc
          command -v llvm-rc
          test -x /usr/local/bin/llvm-rc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-msvc-cross-check

      - name: Cross-check Windows Rust targets
        shell: bash
        run: |
          cargo check \
            --manifest-path src-tauri/Cargo.toml \
            --target x86_64-pc-windows-msvc \
            --all-targets

  check:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Type-check and build frontend
        run: npm run build

      - name: Check Rust backend and binaries
        id: cargo-check
        continue-on-error: true
        shell: pwsh
        run: |
          cmd /c "cargo check --manifest-path src-tauri/Cargo.toml --all-targets > cargo-check.log 2>&1"
          $exitCode = $LASTEXITCODE
          Get-Content cargo-check.log
          exit $exitCode

      - name: Upload Rust check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-log
          path: cargo-check.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail when Rust check failed
        if: steps.cargo-check.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Run Rust unit tests
        id: cargo-unit-test
        continue-on-error: true
        timeout-minutes: 12
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\run-rust-unit-tests.ps1 `
            -ManifestPath .\src-tauri\Cargo.toml `
            -LogPath .\cargo-unit-test.log

      - name: Upload Rust unit test log
        if: always() && steps.cargo-unit-test.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: rust-unit-test-log
          path: cargo-unit-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose Windows unit-test loader failure
        if: steps.cargo-unit-test.outcome == 'failure'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\diagnose-windows-test-loader.ps1

      - name: Upload Windows unit-test loader diagnostics
        if: steps.cargo-unit-test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-loader-diagnostics
          path: test-loader-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Fail when Rust unit tests failed
        if: steps.cargo-unit-test.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Run ConPTY smoke tests
        id: cargo-test
        continue-on-error: true
        timeout-minutes: 12
        shell: pwsh
        run: |
          cmd /c "cargo test --manifest-path src-tauri/Cargo.toml --test conpty_smoke -- --nocapture --test-threads=1 > cargo-test.log 2>&1"
          $exitCode = $LASTEXITCODE
          Get-Content cargo-test.log
          exit $exitCode

      - name: Upload ConPTY smoke test log
        if: always() && steps.cargo-test.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: conpty-smoke-test-log
          path: cargo-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when ConPTY smoke tests failed
        if: steps.cargo-test.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Build automation CLIs
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin tonymux-cli --bin cmux-cli

      - name: Upload automation CLIs
        uses: actions/upload-artifact@v4
        with:
          name: tonymux-cli-windows-x64
          path: |
            src-tauri/target/release/tonymux-cli.exe
            src-tauri/target/release/cmux-cli.exe
          if-no-files-found: error
          retention-days: 7

  installer:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build MSI and NSIS installers
        run: npm run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: tonymux-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
