name: ChatGPT Source Export

on:
  pull_request:
    branches:
      - fix/terminal-session-lifecycle
    paths:
      - .github/workflows/chatgpt-source-export-terminal68-diag.yml

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact PR base commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ github.event.pull_request.base.sha }}"
          git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Package exact source snapshot with Git history
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cmux-wins-terminal68-diag-with-git.tar.gz"
          checksum="$archive.sha256"
          tar -C "$GITHUB_WORKSPACE" -czf "$archive" .
          test -s "$archive"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$archive")" > "$(basename "$checksum")"
          )

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cmux-wins-terminal68-diag-with-git
          path: |
            ${{ runner.temp }}/cmux-wins-terminal68-diag-with-git.tar.gz
            ${{ runner.temp }}/cmux-wins-terminal68-diag-with-git.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
