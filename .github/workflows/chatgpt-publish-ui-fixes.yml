name: ChatGPT Publish Verified Fixes

on:
  pull_request:
    branches:
      - feat/tony-design-system-ui
    paths:
      - .github/workflows/chatgpt-publish-ui-fixes.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: 675a711846a72052d987cbd6854e2fe1fe881f3a
      UI_TREE_SHA: 9550771329aef41dce8514225645faa242e30db9
      PERF_TREE_SHA: aded9e502db11eb491bda3a05e2270e739584872
      UI_PATCH_SHA256: 73dd48409b6824fc298062e6079693f97e391d35f22666b749cbf60eb3cccaff
      PERF_PATCH_SHA256: 710a4fc175040e60361c3312547981d86d5a2ad23f7451f5b0fcbdf51ac5c550
      UI_PATCH_B64: 
      PERF_PATCH_B64: 

    steps:
      - name: Checkout exact target history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BASE_SHA }}

      - name: Verify and publish exact commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "${{ github.event.pull_request.base.sha }}" = "$BASE_SHA"

          printf '%s' "$UI_PATCH_B64" | base64 --decode > "$RUNNER_TEMP/ui.patch"
          printf '%s' "$PERF_PATCH_B64" | base64 --decode > "$RUNNER_TEMP/perf.patch"
          echo "$UI_PATCH_SHA256  $RUNNER_TEMP/ui.patch" | sha256sum --check
          echo "$PERF_PATCH_SHA256  $RUNNER_TEMP/perf.patch" | sha256sum --check

          git config user.name hungtvb
          git config user.email 69663872+hungtvb@users.noreply.github.com

          git am --committer-date-is-author-date "$RUNNER_TEMP/ui.patch"
          test "$(git rev-parse HEAD^{tree})" = "$UI_TREE_SHA"
          ui_commit="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/feat/tony-design-system-ui:$BASE_SHA" origin "$ui_commit:refs/heads/feat/tony-design-system-ui"

          git am --committer-date-is-author-date "$RUNNER_TEMP/perf.patch"
          test "$(git rev-parse HEAD^{tree})" = "$PERF_TREE_SHA"
          perf_commit="$(git rev-parse HEAD)"
          git push origin "$perf_commit:refs/heads/fix/terminal-history-byte-trimming"

          printf 'UI_COMMIT=%s\nPERF_COMMIT=%s\n' "$ui_commit" "$perf_commit" >> "$GITHUB_STEP_SUMMARY"
